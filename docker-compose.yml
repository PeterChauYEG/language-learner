services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: language_learner
      POSTGRES_PASSWORD: language_learner
      POSTGRES_DB: language_learner
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U language_learner -d language_learner']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
